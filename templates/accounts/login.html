    {% load static %}
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OrganizaStudy — Login</title>
        <link rel="stylesheet" href="{% static 'css/login.css' %}">
    </head>
    <body>
        <div class="page">
            <div class="card">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1>OrganizaStudy</h1>
                        <p>Plataforma de estudos</p>
                    </div>
                </div>

                <h2>Bem-vindo de volta</h2>
                <p class="subtitle">Entre na sua conta para continuar</p>

                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}

                <form id="login-form" onsubmit="return false;">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="username" placeholder="seu.usuario" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="button" class="btn" onclick="fazerLogin()">Entrar</button>
                </form>

                <div class="divider"><span>ou</span></div>

                <p class="register-link">
                    Não tem conta? <a href="/cadastro/">Criar conta</a>
                </p>
            </div>
        </div>
            <script>
            async function fazerLogin() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('/api/token/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        window.location.href = '/dashboard/';
                    } else {
                        alert('Usuário ou senha incorretos');
                    }
                } catch (err) {
                    alert('Erro ao conectar com o servidor');
                }
            }
        </script>
    </body>
    </html>
